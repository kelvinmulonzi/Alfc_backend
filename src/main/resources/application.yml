spring:
  application:
    name: Alfc
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin-token: ${ADMIN_TOKEN:dev-admin-token-change-me}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    channel-id: ${YOUTUBE_CHANNEL_ID:UCL_RqdXTMyCyThK8Ub0iqXw}
    poll-interval-ms: 60000
