spring:
  application:
    name: Alfc
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  admin-token: ${ADMIN_TOKEN:dev-admin-token-change-me}
  youtube:
    api-key: ${YOUTUBE_API_KEY:AIzaSyB5DcuDUS8Ibfod4P8Rn_OB5kywZ5_8UVQ}
    channel-id: ${YOUTUBE_CHANNEL_ID:UCZDEZVtJAf93Hj08oB08Gug}
    # search.list costs 100 quota units/call; default daily quota is 10,000.
    # 15 min => 96 calls/day = 9,600 units, just under quota. Do not lower this
    # without raising the quota, or the channel will read "offline" mid-service.
    poll-interval-ms: ${YOUTUBE_POLL_INTERVAL_MS:900000}
