
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/alfc
    username: alfc
    password: alfc
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  admin-token: dev-admin-token
  jwt-secret: dev-jwt-secret-please-change-me-this-must-be-at-least-32-bytes-long
  jwt-ttl-days: 30

logging:
  level:
    com.example.Alfc: DEBUG
